<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Avise Predic - IA Football Réel & eSport Expert</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen">

  <div id="app">
    <!-- HEADER -->
    <header class="bg-slate-900 border-b border-slate-800 p-4 sticky top-0 z-50 shadow-lg">
      <div class="max-w-4xl mx-auto flex justify-between items-center">
        <div class="flex items-center gap-2">
          <span class="text-emerald-400 font-black text-2xl tracking-wider">AVISE PREDIC</span>
          <span class="bg-emerald-500/10 text-emerald-400 text-[10px] font-bold px-2 py-0.5 rounded border border-emerald-500/20">GEMINI IA ENGINE</span>
        </div>
      </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 md:p-6">
      <!-- SÉLECTEUR GLOBAL (Football vs eSport) -->
      <div class="flex gap-3 mb-6">
        <button 
          @click="modeGlobal = 'football'"
          :class="[
            'flex-1 py-3.5 rounded-xl font-black text-sm transition-all flex justify-center items-center gap-2 cursor-pointer',
            modeGlobal === 'football' 
              ? 'bg-emerald-500 text-slate-950 shadow-lg shadow-emerald-500/20' 
              : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'
          ]"
        >
          ⚽ Football Réel
        </button>

        <button 
          @click="modeGlobal = 'esport'"
          :class="[
            'flex-1 py-3.5 rounded-xl font-black text-sm transition-all flex justify-center items-center gap-2 cursor-pointer',
            modeGlobal === 'esport' 
              ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/20' 
              : 'bg-slate-900 text-slate-400 border border-slate-800 hover:bg-slate-800'
          ]"
        >
          🎮 FIFA eSport & Virtuel
        </button>
      </div>

      <!-- FORMULAIRE PRINCIPAL -->
      <div class="bg-slate-900/80 backdrop-blur border border-slate-800 rounded-2xl p-5 md:p-6 mb-6 shadow-xl">
        
        <!-- MODULE FOOTBALL RÉEL -->
        <div v-if="modeGlobal === 'football'" class="space-y-4">
          <h2 class="text-xs font-bold uppercase tracking-wider text-emerald-400 flex items-center gap-2">
            🏆 Match de Football Réel
          </h2>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Équipe Domicile</label>
              <input v-model="form.homeTeam" type="text" placeholder="Ex: Real Madrid" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100">
            </div>
            <div>
              <label class="block text-xs font-semibold text-slate-400 mb-1">Équipe Extérieur</label>
              <input v-model="form.awayTeam" type="text" placeholder="Ex: FC Barcelone" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100">
            </div>
          </div>
          <div>
            <label class="block text-xs font-semibold text-slate-400 mb-1">Championnat / Compétition</label>
            <input v-model="form.championnat" type="text" placeholder="Ex: Ligue des Champions" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-emerald-500 text-slate-100">
          </div>
        </div>

        <!-- MODULE ESPORT & VIRTUEL -->
        <div v-if="modeGlobal === 'esport'" class="space-y-5">
          <h2 class="text-xs font-bold uppercase tracking-wider text-indigo-400 flex items-center gap-2">
            🎮 Catégorie Virtuelle
          </h2>

          <!-- ONGLET DES JEUX VIRTUELS -->
          <div class="grid grid-cols-2 md:grid-cols-5 gap-2">
            <button 
              v-for="cat in categoriesVirtuelles" 
              :key="cat"
              @click="form.categorieVirtuelle = cat"
              :class="[
                'py-2 px-3 rounded-lg text-xs font-bold transition-all border cursor-pointer text-center',
                form.categorieVirtuelle === cat 
                  ? 'bg-indigo-600 text-white border-indigo-400 shadow-md' 
                  : 'bg-slate-950 text-slate-400 border-slate-800 hover:bg-slate-800'
              ]"
            >
              {{ cat }}
            </button>
          </div>

          <!-- FORMULAIRE SPÉCIFIQUE JEU 21 -->
          <div v-if="form.categorieVirtuelle === 'Jeu 21'" class="space-y-4 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Variante du Jeu 21</label>
                <select v-model="form.variantJeu21" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
                  <option value="Jeu 21 Classique">Jeu 21 Classique</option>
                  <option value="Jeu 21 Dota">Jeu 21 Dota</option>
                </select>
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">N° de Partie / Heure de Début</label>
                <input v-model="form.numPartie" type="text" placeholder="Ex: Partie 34" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
              </div>
            </div>

            <!-- ORDRE DES JOUEURS DUMENT CORRIGÉ -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Joueur / Côté 1</label>
                <input v-model="form.homeTeam" type="text" placeholder="Joueur" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Croupier / Côté 2</label>
                <input v-model="form.awayTeam" type="text" placeholder="Croupier" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
              </div>
            </div>
          </div>

          <!-- FORMULAIRE AUTRES JEUX (Volta, Cyberleagues, Dés, Penalties) -->
          <div v-else class="space-y-4 bg-slate-950/50 p-4 rounded-xl border border-slate-800">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Joueur 1 / Côté 1</label>
                <input v-model="form.homeTeam" type="text" placeholder="Joueur 1" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
              </div>
              <div>
                <label class="block text-xs font-semibold text-slate-400 mb-1">Joueur 2 / Côté 2</label>
                <input v-model="form.awayTeam" type="text" placeholder="Joueur 2" class="w-full bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-indigo-500 text-slate-100">
              </div>
            </div>
          </div>

        </div>

        <!-- BOUTON DE GÉNÉRATION -->
        <button 
          @click="genererAnalyse" 
          :disabled="loading"
          :class="[
            'w-full mt-6 py-4 rounded-xl font-black text-sm uppercase tracking-wider transition-all flex justify-center items-center gap-2 cursor-pointer',
            modeGlobal === 'football' 
              ? 'bg-emerald-500 hover:bg-emerald-400 text-slate-950 shadow-lg shadow-emerald-500/20' 
              : 'bg-indigo-600 hover:bg-indigo-500 text-white shadow-lg shadow-indigo-600/20',
            loading ? 'opacity-50 cursor-not-allowed' : ''
          ]"
        >
          <span v-if="loading" class="animate-spin">⏳</span>
          <span>{{ loading ? 'Analyse par l\'IA en cours...' : (modeGlobal === 'football' ? '⚡ Générer l\'Analyse Football' : '⚡ Générer l\'Analyse Expert eSport') }}</span>
        </button>

      </div>

      <!-- MESSAGE D'ERREUR -->
      <div v-if="error" class="bg-red-500/10 border border-red-500/30 text-red-400 p-4 rounded-xl mb-6 text-sm flex items-center gap-2">
        ⚠️ {{ error }}
      </div>

      <!-- RÉSULTAT DE L'ANALYSE -->
      <div v-if="analyse" class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl space-y-4">
        <h3 class="text-lg font-bold text-emerald-400 flex items-center gap-2">
          📊 Résultat de l'Analyse Expert
        </h3>
        <div class="prose prose-invert max-w-none text-slate-300 text-sm whitespace-pre-line leading-relaxed">
          {{ analyse }}
        </div>
      </div>
    </main>
  </div>

  <script>
    const { createApp, ref, reactive } = Vue;

    createApp({
      setup() {
        const modeGlobal = ref('esport');
        const categoriesVirtuelles = ['Cyberleagues', 'Volta (3x3/4x4/5x5)', 'Penalties', 'Jeux de Dés', 'Jeu 21'];
        const loading = ref(false);
        const error = ref('');
        const analyse = ref('');

        const form = reactive({
          homeTeam: 'Joueur',
          awayTeam: 'Croupier',
          championnat: '',
          categorieVirtuelle: 'Jeu 21',
          variantJeu21: 'Jeu 21 Classique',
          numPartie: '34'
        });

        const genererAnalyse = async () => {
          loading.value = true;
          error.value = '';
          analyse.value = '';

          try {
            // URL vers ton Backend sur Render
            const response = await fetch('https://reviz-predict-backend.onrender.com/api/analyser', {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                homeTeam: form.homeTeam || (form.categorieVirtuelle === 'Jeu 21' ? 'Joueur' : 'Équipe 1'),
                awayTeam: form.awayTeam || (form.categorieVirtuelle === 'Jeu 21' ? 'Croupier' : 'Équipe 2'),
                championnat: form.categorieVirtuelle === 'Jeu 21' ? form.variantJeu21 : form.championnat,
                type: modeGlobal.value === 'football' ? 'football' : form.categorieVirtuelle,
                numPartie: form.numPartie
              })
            });

            const data = await response.json();

            if (data.status === 'ok') {
              analyse.value = data.analyse;
            } else {
              error.value = data.message || "Erreur lors de la génération de l'analyse.";
            }
          } catch (err) {
            console.error(err);
            error.value = "Impossible de contacter le serveur backend. Vérifie la connexion Render.";
          } finally {
            loading.value = false;
          }
        };

        return {
          modeGlobal,
          categoriesVirtuelles,
          form,
          loading,
          error,
          analyse,
          genererAnalyse
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
