<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reviz Predict</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 800px;
      margin: 0 auto;
    }
    h1 {
      text-align: center;
      color: #38bdf8;
    }
    .card {
      background-color: #1e293b;
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    button {
      background-color: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    .status {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 0.85em;
      font-weight: bold;
    }
    .status-ok {
      background-color: #166534;
      color: #4ade80;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>⚽ Reviz Predict 🎮</h1>
    
    <div class="card">
      <h2>Statut du Serveur Backend</h2>
      <button onclick="verifierServeur()">Tester le serveur</button>
      <p id="serveur-status">Clique sur le bouton pour vérifier le serveur.</p>
    </div>

    <div class="card">
      <h2>Prédictions Football</h2>
      <button onclick="chargerFootball()">Afficher les matchs</button>
      <div id="football-results"></div>
    </div>

    <div class="card">
      <h2>Prédictions E-Sport</h2>
      <button onclick="chargerEsport()">Afficher les matchs E-Sport</button>
      <div id="esport-results"></div>
    </div>
  </div>

  <script>
    const API_URL = "https://reviz-predict-backend.onrender.com/api";

    async function verifierServeur() {
      const statusElement = document.getElementById("serveur-status");
      statusElement.innerText = "Chargement...";
      try {
        const response = await fetch(`${API_URL}/health`);
        const data = await response.json();
        if (data.status === "ok") {
          statusElement.innerHTML = `<span class="status status-ok">🟢 En ligne (Mode Demo: ${data.demoMode})</span>`;
        }
      } catch (error) {
        statusElement.innerText = "❌ Erreur de connexion au serveur.";
      }
    }

    async function chargerFootball() {
      const resElement = document.getElementById("football-results");
      resElement.innerText = "Chargement des prédictions...";
      try {
        const response = await fetch(`${API_URL}/football`);
        const data = await response.json();
        resElement.innerHTML = `<p><strong>Message:</strong> ${data.message}</p>`;
      } catch (error) {
        resElement.innerText = "❌ Impossible de charger le football.";
      }
    }

    async function chargerEsport() {
      const resElement = document.getElementById("esport-results");
      resElement.innerText = "Chargement des prédictions...";
      try {
        const response = await fetch(`${API_URL}/esport`);
        const data = await response.json();
        resElement.innerHTML = `<p><strong>Message:</strong> ${data.message}</p>`;
      } catch (error) {
        resElement.innerText = "❌ Impossible de charger l'Esport.";
      }
    }
  </script>

</body>
</html>
